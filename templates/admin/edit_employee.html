{% extends "base.html" %}

{% block title %}تعديل الموظف - COFFLOW{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('admin_employees') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-right"></i> العودة للقائمة
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg">
            <div class="card-header text-center">
                <h3 class="mb-0">
                    <i class="fas fa-user-edit"></i> تعديل بيانات الموظف
                </h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin_edit_employee', id=employee.id) }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            <i class="fas fa-user"></i> الاسم الكامل
                        </label>
                        <input type="text" class="form-control form-control-lg" id="name" name="name" 
                               value="{{ employee.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label">
                            <i class="fas fa-phone"></i> رقم الجوال
                        </label>
                        <input type="text" class="form-control form-control-lg" id="phone" name="phone" 
                               value="{{ employee.phone }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i> البريد الإلكتروني (اختياري)
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" 
                               value="{{ employee.email or '' }}">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i> كلمة المرور الجديدة
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password">
                        <div class="form-text">اتركه فارغاً إذا كنت لا تريد تغيير كلمة المرور</div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-save"></i> حفظ التغييرات
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
