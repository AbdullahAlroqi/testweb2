# اسم هذا الـ Workflow (سيظهر في تبويب Actions)
name: Deploy to Cloud Run

# متى يتم تشغيل هذا الكود
on:
  push:
    branches:
      - main  # شغله فقط عند الـ push على الفرع الرئيسي 'main'

# متغيرات البيئة التي ستستخدمها
env:
  PROJECT_ID: "cofflow"       # 👈 غير هذا: رقم مشروعك في جوجل
  SERVICE_NAME: "cofflow"          # 👈 غير هذا: اسم خدمتك في Cloud Run
  REGION: "us-central1"               # 👈 غير هذا: المنطقة التي ستنشر فيها

jobs:
  deploy:
    # استخدم نظام تشغيل Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. المصادقة وتسجيل الدخول إلى Google Cloud
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # 3. إعداد Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4. بناء صورة الحاوية (Container Image) باستخدام Dockerfile
      # سيتم رفع الصورة إلى Google Artifact Registry
      - name: Build Docker image
        run: |-
          gcloud builds submit \
            --tag "gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            .
      
      # 5. نشر الحاوية الجديدة إلى Cloud Run
      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated # اسمح للجميع بزيارة الموقع
